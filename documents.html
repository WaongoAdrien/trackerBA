let docs = [];

const thumbCache = new Map();

const $ = (id) => document.getElementById(id);

/* ==================================================================
   Utilities
================================================================== */
function escapeHtml(v) {
  return String(v == null ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function uuid() {
  return (crypto.randomUUID && crypto.randomUUID()) ||
    "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
      const r = Math.random() * 16 | 0;
      return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
    });
}

function formatStamp(value) {
  const d = new Date(value);
  if (isNaN(d)) return "";
  const parts = new Intl.DateTimeFormat("en-US", {
    weekday: "short", day: "2-digit", month: "short", year: "2-digit"
  }).formatToParts(d);
  const get = (t) => (parts.find((p) => p.type === t) || {}).value || "";
  return `${get("weekday")}-${get("day")}-${get("month")}-${get("year")}`;
}

function fileSize(bytes) {
  const n = Number(bytes) || 0;
  if (n < 1024) return `${n} B`;
  if (n < 1048576) return `${(n / 1024).toFixed(0)} KB`;
  if (n < 1073741824) return `${(n / 1048576).toFixed(1)} MB`;
  return `${(n / 1073741824).toFixed(2)} GB`;
}

const isImage = (d) => /^image\//.test(d.mime_type || "");

// A short, readable label rather than a raw mime type
function kindLabel(d) {
  const name = (d.file_name || "").toLowerCase();
  const ext = name.includes(".") ? name.split(".").pop() : "";
  const known = {
    pdf: "PDF", doc: "DOC", docx: "DOC", xls: "XLS", xlsx: "XLS", csv: "CSV",
    ppt: "PPT", pptx: "PPT", txt: "TXT", zip: "ZIP", msg: "MSG", eml: "EML",
    png: "PNG", jpg: "JPG", jpeg: "JPG", gif: "GIF", webp: "WEBP", heic: "HEIC"
  };
  return known[ext] || (ext ? ext.slice(0, 4).toUpperCase() : "FILE");
}

// The file name is the title, as-is
function titleFromFile(name) { return String(name || "").trim(); }

/* ------------------------------------------------------------------
   Duplicate detection

   Files: an identical name is the signal worth acting on, and it is
   worth catching before spending the upload.
   Notes: titles rarely repeat word for word, so score them, using the
   same two measures as the Playbook.
------------------------------------------------------------------ */
const DUPE_THRESHOLD = 0.5;

function normaliseTitle(t) {
  return String(t || "").toLowerCase().replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
}

function bigramCounts(text) {
  const map = new Map();
  for (let i = 0; i < text.length - 1; i++) {
    const g = text.slice(i, i + 2);
    map.set(g, (map.get(g) || 0) + 1);
  }
  return map;
}

function charScore(a, b) {
  const ga = bigramCounts(a), gb = bigramCounts(b);
  if (!ga.size || !gb.size) return 0;
  let overlap = 0, total = 0;
  ga.forEach((n, g) => { total += n; if (gb.has(g)) overlap += Math.min(n, gb.get(g)); });
  gb.forEach((n) => { total += n; });
  return total ? (2 * overlap) / total : 0;
}

function wordScore(a, b) {
  const A = new Set(a.split(" ").filter(Boolean));
  const B = new Set(b.split(" ").filter(Boolean));
  if (!A.size || !B.size) return 0;
  let shared = 0;
  A.forEach((w) => { if (B.has(w)) shared++; });
  return (2 * shared) / (A.size + B.size);
}

function similarity(a, b) {
  const A = normaliseTitle(a), B = normaliseTitle(b);
  if (!A || !B) return 0;
  if (A === B) return 1;
  return Math.max(charScore(A, B), wordScore(A, B));
}

// Compared against everything on the page, since a note can restate a document
function similarEntries(title, excludeId) {
  if (normaliseTitle(title).length < 3) return [];
  return docs
    .filter((d) => d.id !== excludeId)
    .map((d) => ({ entry: d, score: similarity(title, d.title) }))
    .filter((m) => m.score >= DUPE_THRESHOLD)
    .sort((a, b) => b.score - a.score)
    .slice(0, 3);
}

function checkNoteDuplicates() {
  const box = $("note-dupe");
  const matches = similarEntries($("note-title").value, editingNote);

  if (!matches.length) { box.hidden = true; box.innerHTML = ""; return; }

  const exact = matches[0].score === 1;
  box.hidden = false;
  box.className = "dupe-warning" + (exact ? " is-exact" : "");
  box.innerHTML = `
    <span class="dupe-lead">${exact ? "Something here already has this exact title" : "This looks like something you already have"}</span>
    <ul class="dupe-list">
      ${matches.map((m) => `
        <li>
          <span class="dupe-open as-text">${escapeHtml(m.entry.title)}</span>
          <span class="dupe-score">${m.entry.kind === "note" ? "note" : "file"} · ${Math.round(m.score * 100)}% alike</span>
        </li>`).join("")}
    </ul>
    <span class="dupe-hint">You can still save this one.</span>`;
}

/* Same lightweight markdown as the other pages. Escaped first. */
function inlineMd(t) {
  return t
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}

function renderMarkdown(src) {
  const lines = String(src || "").split("\n");
  let html = "", list = null, para = [];
  const fmt = (t) => inlineMd(escapeHtml(t));
  const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
  const closePara = () => { if (para.length) { html += `<p>${para.map(fmt).join("<br>")}</p>`; para = []; } };
  const closeBlocks = () => { closePara(); closeList(); };

  for (const raw of lines) {
    const line = raw.trimEnd();
    if (!line.trim()) { closeBlocks(); continue; }
    let m;
    if ((m = line.match(/^(#{1,3})\s+(.*)$/))) { closeBlocks(); html += `<h4>${fmt(m[2])}</h4>`; continue; }
    if (/^(---|\*\*\*)\s*$/.test(line)) { closeBlocks(); html += "<hr>"; continue; }
    if ((m = line.match(/^>\s?(.*)$/))) { closeBlocks(); html += `<blockquote>${fmt(m[1])}</blockquote>`; continue; }
    if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) {
      if (list !== "ul") { closeBlocks(); html += "<ul>"; list = "ul"; }
      html += `<li>${fmt(m[1])}</li>`; continue;
    }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
      if (list !== "ol") { closeBlocks(); html += "<ol>"; list = "ol"; }
      html += `<li>${fmt(m[1])}</li>`; continue;
    }
    closeList();
    para.push(line);
  }
  closeBlocks();
  return html;
}

function toast(message, options = {}) {
  const el = document.createElement("div");
  el.className = "toast" + (options.tone ? ` toast-${options.tone}` : "");
  const span = document.createElement("span");
  span.textContent = message;
  el.appendChild(span);
  $("toasts").appendChild(el);
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 250); },
    options.duration || 4000);
  return el;
}

function openModal(id) { $(id).hidden = false; document.body.classList.add("modal-open"); }
function closeModal(id) {
  $(id).hidden = true;
  if (!document.querySelector(".modal:not([hidden])")) document.body.classList.remove("modal-open");
  if (id === "doc-modal") editingDoc = null;
  if (id === "confirm-modal") confirmAction = null;
}
function askConfirm(title, text, onConfirm, label = "Confirm") {
  $("confirm-title").textContent = title;
  $("confirm-text").textContent = text;
  $("confirm-ok").textContent = label;
  confirmAction = onConfirm;
  openModal("confirm-modal");
}
document.querySelectorAll("[data-close]").forEach((el) =>
  el.addEventListener("click", () => closeModal(el.dataset.close)));
document.querySelectorAll(".modal").forEach((m) =>
  m.addEventListener("click", (e) => { if (e.target === m) closeModal(m.id); }));
$("confirm-ok").addEventListener("click", () => {
  const a = confirmAction; closeModal("confirm-modal"); if (a) a();
});

/* ==================================================================
   Data
================================================================== */
async function loadDocs() {
  const { data, error } = await sb.from("documents").select("*").order("created_at", { ascending: false });
  if (error) {
    if (error.code === "PGRST205" || /could not find the table|does not exist/i.test(error.message)) {
      const b = $("mode-banner");
      b.hidden = false;
      b.textContent = "The documents table does not exist yet — run supabase-documents.sql in the Supabase SQL Editor, then reload.";
      docs = [];
      return;
    }
    throw error;
  }
  docs = data;
}

function matches(d) {
  if (categoryFilter !== "all" && d.category !== categoryFilter) return false;
  const term = search.trim().toLowerCase();
  if (!term) return true;
  return [d.title, d.note, d.file_name, d.category].join(" ").toLowerCase().includes(term);
}

function visible(kind) {
  return docs.filter((d) => (d.kind || "file") === kind && matches(d)).sort((a, b) => {
    if (sortBy === "alpha") return a.title.localeCompare(b.title);
    if (sortBy === "oldest") return Date.parse(a.created_at) - Date.parse(b.created_at);
    if (sortBy === "size") return (b.file_size || 0) - (a.file_size || 0);
    return Date.parse(b.created_at) - Date.parse(a.created_at);
  });
}

const filtersActive = () => search !== "" || categoryFilter !== "all";

/* ==================================================================
   Files
================================================================== */
async function signedUrl(d, forDownload) {
  const { data, error } = await sb.storage.from(BUCKET)
    .createSignedUrl(d.file_path, 3600, forDownload ? { download: d.file_name } : undefined);
  if (error) throw error;
  return data.signedUrl;
}

async function uploadFile(file, onProgress) {
  const id = uuid();
  const path = `${currentUser.id}/documents/${id}-${file.name}`;

  if (file.size >= RESUMABLE_THRESHOLD && window.tus) {
    const { data } = await sb.auth.getSession();
    const token = data.session.access_token;
    await new Promise((resolve, reject) => {
      const up = new window.tus.Upload(file, {
        endpoint: `${SUPABASE_URL}/storage/v1/upload/resumable`,
        headers: { authorization: `Bearer ${token}`, "x-upsert": "false" },
        uploadDataDuringCreation: true, chunkSize: RESUMABLE_THRESHOLD,
        metadata: { bucketName: BUCKET, objectName: path, contentType: file.type || "application/octet-stream" },
        onError: reject, onSuccess: resolve,
        onProgress: (sent, total) => onProgress && onProgress(sent / total)
      });
      up.start();
    });
  } else {
    if (onProgress) onProgress(0);
    const { error } = await sb.storage.from(BUCKET)
      .upload(path, file, { contentType: file.type || "application/octet-stream" });
    if (error) throw error;
    if (onProgress) onProgress(1);
  }

  const row = {
    id, user_id: currentUser.id, kind: "file",
    title: titleFromFile(file.name),
    note: "", category: "Issue Resolution",
    file_name: file.name, file_path: path,
    file_size: file.size, mime_type: file.type || null
  };
  const { data, error } = await sb.from("documents").insert(row).select().single();
  if (error) { await sb.storage.from(BUCKET).remove([path]); throw error; }
  return data;
}

function queueRow(file) {
  const li = document.createElement("li");
  li.className = "queue-row";
  li.innerHTML = `
    <span class="queue-name">${escapeHtml(file.name)}</span>
    <span class="queue-size">${escapeHtml(fileSize(file.size))}</span>
    <span class="upload-track"><span class="upload-fill"></span></span>
    <span class="upload-pct">0%</span>`;
  $("upload-queue").appendChild(li);
  const fill = li.querySelector(".upload-fill");
  const pct = li.querySelector(".upload-pct");
  return {
    set(f) { const p = Math.min(100, Math.round((f || 0) * 100)); fill.style.width = p + "%"; pct.textContent = p + "%"; },
    done() { li.remove(); },
    fail() { li.classList.add("failed"); pct.textContent = "failed"; setTimeout(() => li.remove(), 3000); }
  };
}

function alreadyStored(file) {
  return docs.find((d) => d.kind === "file" &&
    (d.file_name || "").toLowerCase() === file.name.toLowerCase());
}

// Check before uploading, not after: a repeat upload costs time and storage
async function addFiles(fileList) {
  const all = Array.from(fileList);
  if (!all.length) return;

  const repeats = all.filter(alreadyStored);
  const fresh = all.filter((f) => !alreadyStored(f));

  if (fresh.length) uploadEach(fresh);

  if (repeats.length) {
    const names = repeats.map((f) => `"${f.name}"`).join(", ");
    askConfirm(
      repeats.length === 1 ? "Already stored" : `${repeats.length} already stored`,
      repeats.length === 1
        ? `${names} is already in your documents. Add it again as a second copy?`
        : `${names} are already in your documents. Add them again as second copies?`,
      () => uploadEach(repeats),
      "Add anyway");
  }
}

async function uploadEach(files) {
  for (const file of files) {
    if (file.size > MAX_UPLOAD_MB * 1024 * 1024) {
      toast(`"${file.name}" is ${fileSize(file.size)}. The limit is ${MAX_UPLOAD_MB} MB.`,
        { tone: "error", duration: 10000 });
      continue;
    }

    const bar = queueRow(file);
    try {
      const row = await uploadFile(file, (f) => bar.set(f));
      docs.unshift(row);
      bar.done();
      render();
      toast(`${file.name} added.`, { tone: "success" });
    } catch (error) {
      bar.fail();
      console.error("Upload failed", file.name, error);
      const raw = (error && (error.message || error.error) || "") + "";
      const hint = /bucket/i.test(raw) ? " The task-files bucket is missing."
        : /row-level|policy|403/i.test(raw) ? " Storage policies are missing."
        : /413|exceeded|too large/i.test(raw) ? " Larger than the project's upload limit."
        : "";
      toast(`${file.name} failed.${hint} ${raw}`.trim(), { tone: "error", duration: 12000 });
    }
  }
}

$("pick-file").addEventListener("click", () => $("file-input").click());
$("file-input").addEventListener("change", (e) => {
  const files = Array.from(e.target.files || []);   // copy before clearing
  e.target.value = "";
  if (files.length) addFiles(files);
});

const dz = $("dropzone");
["dragenter", "dragover"].forEach((ev) =>
  dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add("over"); }));
["dragleave", "drop"].forEach((ev) =>
  dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.remove("over"); }));
dz.addEventListener("drop", (e) => {
  if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
});

// Paste a screenshot anywhere on the page
document.addEventListener("paste", (e) => {
  if (!$("doc-modal").hidden) return;              // let the note field take its own paste
  const items = Array.from((e.clipboardData && e.clipboardData.items) || []);
  const images = items.filter((i) => i.type.startsWith("image/"));
  if (!images.length) return;
  e.preventDefault();
  const stamp = `screenshot-${new Date().toISOString().replace(/[:.]/g, "-")}.png`;
  addFiles(images.map((i) => {
    const blob = i.getAsFile();
    return new File([blob], blob.name && blob.name !== "image.png" ? blob.name : stamp, { type: blob.type });
  }));
});

/* ==================================================================
   Rendering
================================================================== */
function highlight(text, term) {
  const safe = escapeHtml(text);
  if (!term) return safe;
  const esc = escapeHtml(term).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return safe.replace(new RegExp(`(${esc})`, "gi"), "<mark>$1</mark>");
}

function buildCard(d, term) {
  const card = document.createElement("article");
  card.className = "entry" + (d.kind === "note" ? " entry-note-only" : "");
  card.dataset.id = d.id;

  const noteHtml = d.note && d.note.trim() ? renderMarkdown(d.note) : "";

  card.innerHTML = `
    <div class="entry-head">
      <h3 class="entry-title">${highlight(d.title, term)}</h3>
      <div class="entry-tools">
        <button type="button" class="btn-ghost small" data-act="details">Edit</button>
        <button type="button" class="icon-btn" data-act="remove" aria-label="Delete">✕</button>
      </div>
    </div>

    <div class="entry-meta">
      <span class="chip doc-chip">${escapeHtml(d.category)}</span>
      <span>${escapeHtml(formatStamp(d.created_at))}</span>
      ${d.kind === "file" ? `<span>${escapeHtml(fileSize(d.file_size))}</span>` : ""}
    </div>

    <div class="entry-body" data-body="${d.id}">
      <div class="entry-body-inner">${noteHtml}</div>
    </div>
    <button type="button" class="read-more is-placeholder" data-act="more">Read more</button>

    ${d.kind === "file" ? `
      <div class="attach-row">
        <button type="button" class="attach-thumb${isImage(d) ? " is-image" : ""}" data-act="preview"
                aria-label="Open ${escapeHtml(d.file_name || "")}">
          ${isImage(d) ? `<img alt="" loading="lazy" data-thumb="${d.id}">`
                       : `<span class="attach-kind">${escapeHtml(kindLabel(d))}</span>`}
        </button>
        <button type="button" class="attach-name" data-act="preview">${escapeHtml(d.file_name || "")}</button>
        <button type="button" class="btn-ghost small" data-act="download">Save</button>
      </div>
    ` : ""}`;
  return card;
}

async function loadThumbs() {
  for (const d of visible("file").filter(isImage)) {
    const img = document.querySelector(`[data-thumb="${d.id}"]`);
    if (!img || img.dataset.loaded) continue;
    img.dataset.loaded = "1";
    try {
      if (!thumbCache.has(d.id)) thumbCache.set(d.id, await signedUrl(d, false));
      img.src = thumbCache.get(d.id);
    } catch (e) { /* a missing thumbnail should not break the card */ }
  }
}

// A list holding an expanded card stops stretching its cards to match,
// so opening one note does not inflate the ones beside it.
function markOpenState(list) {
  if (!list) return;
  list.classList.toggle("has-open", !!list.querySelector(".entry-body.open"));
}

// Offer Read more only where the note is actually cut off
function updateClamps() {
  document.querySelectorAll(".entry-body").forEach((body) => {
    const btn = body.parentElement.querySelector(".read-more");
    if (!btn) return;
    const open = body.classList.contains("open");
    const over = body.scrollHeight > body.clientHeight + 2;
    // Hidden by visibility, not removed: the line stays reserved so cards
    // with and without a note still come out the same height.
    btn.classList.toggle("is-placeholder", !(over || open));
    body.classList.toggle("is-clamped", over && !open);
  });
}

function scheduleClamp() {
  requestAnimationFrame(updateClamps);
  setTimeout(updateClamps, 120);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(updateClamps);
}

window.addEventListener("resize", () => {
  clearTimeout(window.__clampT);
  window.__clampT = setTimeout(updateClamps, 150);
});

function fillList(el, items, term, emptyText) {
  el.innerHTML = "";
  if (!items.length) {
    const empty = document.createElement("div");
    empty.className = "guide-empty";
    empty.innerHTML = emptyText;
    el.appendChild(empty);
    return;
  }
  items.forEach((d) => el.appendChild(buildCard(d, term)));
}

function render() {
  const term = search.trim();
  const files = visible("file");
  const notes = visible("note");

  fillList($("doc-grid"), files, term,
    docs.some((d) => d.kind === "file")
      ? "Nothing matches that."
      : "<strong>No documents yet.</strong><br>Drop a file above, or paste a screenshot.");

  fillList($("note-list"), notes, term,
    docs.some((d) => d.kind === "note")
      ? "Nothing matches that."
      : "<strong>No notes yet.</strong><br>Press <em>Write a note</em> to add one.");

  $("file-count").textContent = files.length;
  $("note-count").textContent = notes.length;

  const images = docs.filter((d) => d.kind === "file" && isImage(d)).length;
  const bytes = docs.reduce((n, d) => n + (Number(d.file_size) || 0), 0);
  $("summary").innerHTML = docs.length
    ? `<span class="pill">${docs.filter((d) => d.kind === "file").length} file${docs.filter((d) => d.kind === "file").length === 1 ? "" : "s"}</span>
       ${images ? `<span class="pill">${images} image${images === 1 ? "" : "s"}</span>` : ""}
       ${notes.length ? `<span class="pill">${docs.filter((d) => d.kind === "note").length} note${docs.filter((d) => d.kind === "note").length === 1 ? "" : "s"}</span>` : ""}
       <span class="pill pill-muted">${fileSize(bytes)}</span>`
    : "";

  $("status-line").textContent = "";
  $("build-stamp").textContent = `build ${BUILD}`;
  $("reset-filters").hidden = !filtersActive();
  $("drop-hint").textContent = `Up to ${MAX_UPLOAD_MB} MB per file`;
  refreshCategoryFilter();
  loadThumbs();
  markOpenState($("doc-grid"));
  markOpenState($("note-list"));
  scheduleClamp();
}

function refreshCategoryFilter() {
  const select = $("filter-category");
  const extra = Array.from(new Set(docs.map((d) => d.category).filter(Boolean)))
    .filter((c) => !CATEGORIES.includes(c)).sort();
  const wanted = ["all", ...CATEGORIES, ...extra];
  if (Array.from(select.options).map((o) => o.value).join("|") === wanted.join("|")) return;
  const keep = categoryFilter;
  select.innerHTML = `<option value="all">All categories</option>` +
    [...CATEGORIES, ...extra].map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
  select.value = wanted.includes(keep) ? keep : "all";
  if (select.value === "all") categoryFilter = "all";
}

/* ==================================================================
   Card actions
================================================================== */
document.addEventListener("click", async (e) => {
  const card = e.target.closest(".entry");
  if (!card) return;
  const d = docs.find((x) => x.id === card.dataset.id);
  if (!d) return;
  const act = e.target.closest("[data-act]");
  if (!act) return;

  switch (act.dataset.act) {
    case "more": {
      const body = card.querySelector(".entry-body");
      const btn = card.querySelector(".read-more");
      const nowOpen = !body.classList.contains("open");
      body.classList.toggle("open", nowOpen);
      btn.textContent = nowOpen ? "Show less" : "Read more";
      markOpenState(card.parentElement);
      updateClamps();
      break;
    }

    case "remove":
      deleteEntry(d);
      break;

    case "preview":
      if (isImage(d)) return showImage(d);
      openFile(d);
      break;

    case "details":
      if (d.kind === "note") openNoteEditor(d); else openDetails(d);
      break;

    case "download":
      try {
        const url = await signedUrl(d, true);
        const a = document.createElement("a");
        a.href = url; a.download = d.file_name;
        document.body.appendChild(a); a.click(); a.remove();
      } catch (err) { toast("Could not save that file.", { tone: "error" }); }
      break;
  }
});

function openFile(d) {
  const tab = window.open("", "_blank");   // claimed now, before the await
  signedUrl(d, false)
    .then((url) => { if (tab) tab.location.href = url; })
    .catch(() => { if (tab) tab.close(); toast("Could not open that file.", { tone: "error" }); });
}

async function showImage(d) {
  try {
    const url = thumbCache.get(d.id) || await signedUrl(d, false);
    $("lightbox-img").src = url;
    $("lightbox-name").textContent = `${d.title} · ${d.file_name}`;
    openModal("image-modal");
  } catch (e) { toast("Could not open that image.", { tone: "error" }); }
}

/* ==================================================================
   Details
================================================================== */
async function openDetails(d) {
  editingDoc = d.id;
  $("doc-modal-title").textContent = d.file_name;
  $("doc-title").value = d.title;
  $("doc-category").value = d.category;
  $("doc-note").value = d.note || "";
  $("doc-facts").innerHTML = `
    <span class="gate-label">File</span>
    <span class="doc-fact">${escapeHtml(kindLabel(d))} · ${escapeHtml(fileSize(d.file_size))}</span>
    <span class="doc-fact">Added ${escapeHtml(formatStamp(d.created_at))}</span>`;

  const preview = $("doc-preview");
  preview.innerHTML = "";
  if (isImage(d)) {
    try {
      const url = thumbCache.get(d.id) || await signedUrl(d, false);
      thumbCache.set(d.id, url);
      const img = document.createElement("img");
      img.src = url; img.alt = d.title;
      preview.appendChild(img);
    } catch (e) { /* preview is optional */ }
  } else {
    preview.innerHTML = `<span class="doc-kind big">${escapeHtml(kindLabel(d))}</span>`;
  }

  openModal("doc-modal");
  setTimeout(() => $("doc-title").focus(), 50);
}

const currentDoc = () => docs.find((d) => d.id === editingDoc);

$("doc-save").addEventListener("click", async () => {
  const d = currentDoc();
  if (!d) return closeModal("doc-modal");
  const title = $("doc-title").value.trim();
  if (!title) { $("doc-title").focus(); return; }

  const patch = { title, category: $("doc-category").value, note: $("doc-note").value.trim() };
  Object.assign(d, patch);
  closeModal("doc-modal");
  render();

  const { error } = await sb.from("documents").update(patch).eq("id", d.id);
  if (error) toast("Could not save those changes.", { tone: "error" });
  else toast("Saved.", { tone: "success" });
});

$("doc-open").addEventListener("click", () => { const d = currentDoc(); if (d) isImage(d) ? showImage(d) : openFile(d); });

$("doc-save-file").addEventListener("click", async () => {
  const d = currentDoc();
  if (!d) return;
  try {
    const url = await signedUrl(d, true);
    const a = document.createElement("a");
    a.href = url; a.download = d.file_name;
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { toast("Could not save that file.", { tone: "error" }); }
});

function deleteEntry(d) {
  const isNote = d.kind === "note";
  askConfirm(isNote ? "Delete note" : "Delete document",
    isNote ? `"${d.title}" will be permanently deleted.`
           : `"${d.title}" and its file will be permanently deleted.`,
    async () => {
      closeModal("doc-modal"); closeModal("note-modal");
      const keep = docs.slice();
      docs = docs.filter((x) => x.id !== d.id);
      render();
      try {
        if (d.file_path) await sb.storage.from(BUCKET).remove([d.file_path]);
        const { error } = await sb.from("documents").delete().eq("id", d.id);
        if (error) throw error;
        toast(isNote ? "Note deleted." : "Document deleted.");
      } catch (e) {
        docs = keep; render();
        toast("Could not delete that.", { tone: "error" });
      }
    }, "Delete");
}

$("doc-delete").addEventListener("click", () => {
  const d = currentDoc();
  if (d) deleteEntry(d);
});

/* ==================================================================
   Notes with no file
================================================================== */
let editingNote = null;

function openNoteEditor(note) {
  editingNote = note ? note.id : null;
  $("note-modal-title").textContent = note ? "Edit note" : "Write a note";
  $("note-title").value = note ? note.title : "";
  $("note-category").value = note ? note.category : "Notes";
  $("note-body").value = note ? (note.note || "") : "";
  $("note-delete").hidden = !note;
  checkNoteDuplicates();
  showNotePreview(false);
  openModal("note-modal");
  setTimeout(() => $("note-title").focus(), 50);
}

$("new-note").addEventListener("click", () => openNoteEditor(null));

let noteDupeTimer = null;
$("note-title").addEventListener("input", () => {
  clearTimeout(noteDupeTimer);
  noteDupeTimer = setTimeout(checkNoteDuplicates, 250);
});
$("note-delete").addEventListener("click", () => {
  const d = docs.find((x) => x.id === editingNote);
  if (d) deleteEntry(d);
});

function showNotePreview(on) {
  $("note-preview").hidden = !on;
  $("note-body").hidden = on;
  $("note-toggle-preview").textContent = on ? "Write" : "Preview";
  if (on) $("note-preview").innerHTML = renderMarkdown($("note-body").value) ||
    '<p class="muted-note">Nothing to preview yet.</p>';
}

$("note-toggle-preview").addEventListener("click", () => showNotePreview($("note-preview").hidden));

$("note-md-bar").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-md]");
  if (!btn) return;
  const ta = $("note-body");
  const start = ta.selectionStart, end = ta.selectionEnd;
  const sel = ta.value.slice(start, end);
  const wrap = (mark) => mark + (sel || "text") + mark;
  const perLine = (prefix) => (sel || "step").split("\n")
    .map((l, i) => (prefix === "1. " ? `${i + 1}. ` : prefix) + l).join("\n");

  let out, caretInside = false;
  switch (btn.dataset.md) {
    case "h":      out = "## " + (sel || "Heading"); break;
    case "bold":   out = wrap("**"); break;
    case "italic": out = wrap("*"); break;
    case "code":   out = wrap("`"); break;
    case "bullet": out = perLine("- "); break;
    case "number": out = perLine("1. "); break;
    case "quote":  out = "> " + (sel || "Remember this"); break;
    case "link":   out = `[${sel || "text"}](https://)`; caretInside = true; break;
  }
  ta.value = ta.value.slice(0, start) + out + ta.value.slice(end);
  const pos = caretInside ? start + out.length - 1 : start + out.length;
  ta.setSelectionRange(pos, pos);
  ta.focus();
});

$("note-save").addEventListener("click", async () => {
  const title = $("note-title").value.trim();
  if (!title) {
    $("note-title").classList.add("invalid");
    $("note-title").placeholder = "Give this note a title";
    $("note-title").focus();
    return;
  }
  $("note-title").classList.remove("invalid");

  const patch = { title, category: $("note-category").value, note: $("note-body").value };

  if (editingNote) {
    const d = docs.find((x) => x.id === editingNote);
    const keep = { ...d };
    Object.assign(d, patch);
    closeModal("note-modal");
    render();
    const { error } = await sb.from("documents").update(patch).eq("id", d.id);
    if (error) { Object.assign(d, keep); render(); toast("Could not save that note.", { tone: "error" }); }
    else toast("Note saved.", { tone: "success" });
    return;
  }

  const row = { id: uuid(), user_id: currentUser.id, kind: "note", file_size: 0, ...patch };
  docs.unshift(row);
  closeModal("note-modal");
  render();
  const { error } = await sb.from("documents").insert(row);
  if (error) {
    docs = docs.filter((x) => x.id !== row.id);
    render();
    toast(/column .* does not exist|kind/i.test(error.message || "")
      ? "Notes need the updated table — run supabase-documents.sql again."
      : `Could not save that note. ${error.message || ""}`.trim(),
      { tone: "error", duration: 10000 });
  } else {
    toast("Note saved.", { tone: "success" });
  }
});

/* ==================================================================
   Toolbar
================================================================== */
let searchTimer = null;
$("search-input").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  const v = e.target.value;
  searchTimer = setTimeout(() => { search = v; render(); }, 150);
});
$("filter-category").addEventListener("change", (e) => { categoryFilter = e.target.value; render(); });
$("sort-by").addEventListener("change", (e) => { sortBy = e.target.value; render(); });
$("reset-filters").addEventListener("click", () => {
  search = ""; categoryFilter = "all";
  $("search-input").value = ""; $("filter-category").value = "all";
  render();
});

document.addEventListener("keydown", (e) => {
  const dialog = document.querySelector(".modal:not([hidden])");
  if (e.key === "Escape" && dialog) return closeModal(dialog.id);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault(); $("search-input").focus(); $("search-input").select();
  }
  if (dialog && (e.metaKey || e.ctrlKey) && e.key === "Enter") {
    e.preventDefault();
    if (dialog.id === "doc-modal") $("doc-save").click();
    if (dialog.id === "note-modal") $("note-save").click();
  }
});

/* ==================================================================
   Auth
================================================================== */
let authMode = "signin";
function setAuthMode(next) {
  authMode = next;
  const inMode = authMode === "signin";
  $("auth-sub").textContent = inMode ? "Sign in to your docs and notes" : "Create your account";
  $("auth-submit").textContent = inMode ? "Sign in" : "Create account";
  $("auth-toggle").textContent = inMode ? "Create one" : "I already have an account";
  $("auth-reset").hidden = !inMode;
  $("auth-error").hidden = true;
}
function authError(msg) { const el = $("auth-error"); el.textContent = msg; el.hidden = !msg; }
$("auth-toggle").addEventListener("click", () => setAuthMode(authMode === "signin" ? "signup" : "signin"));

$("auth-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  authError("");
  const email = $("auth-email").value.trim(), password = $("auth-password").value;
  try {
    if (authMode === "signin") {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    } else {
      const { data, error } = await sb.auth.signUp({ email, password });
      if (error) throw error;
      if (!data.session) { authError("Check your email for a confirmation link."); setAuthMode("signin"); }
    }
  } catch (error) { authError(error.message || "That did not work."); }
});

$("auth-reset").addEventListener("click", async () => {
  const email = $("auth-email").value.trim();
  if (!email) return authError("Enter your email first.");
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href });
  authError(error ? error.message : "Password reset link sent.");
});

$("sign-out").addEventListener("click", () => sb.auth.signOut());

/* ==================================================================
   Start
================================================================== */
async function boot(user) {
  currentUser = user;
  $("account-email").textContent = user.email;
  $("account").hidden = false;
  $("gate").hidden = true;
  $("app").hidden = false;
  $("app-header").hidden = false;
  try { await loadDocs(); } catch (e) { toast(e.message || "Could not load documents.", { tone: "error" }); }
  render();
}

async function init() {
  const options = CATEGORIES.map((c) => `<option value="${c}">${c}</option>`).join("");
  $("doc-category").innerHTML = options;
  $("note-category").innerHTML = options;
  setAuthMode("signin");

  if (!window.supabase) {
    document.body.innerHTML = "<p style='padding:40px;font-family:sans-serif;color:#ccc'>Could not load the Supabase library. Check your connection and reload.</p>";
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  sb.auth.onAuthStateChange((event, session) => {
    if (session && session.user) { if (!currentUser) boot(session.user); }
    else {
      currentUser = null; docs = [];
      $("account").hidden = true;
      $("gate").hidden = false; $("app").hidden = true; $("app-header").hidden = true;
    }
  });

  const { data } = await sb.auth.getSession();
  if (data.session && data.session.user) await boot(data.session.user);
  else $("gate").hidden = false;
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();
</script>
