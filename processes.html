/* ==================================================================
   Utilities
================================================================== */
function escapeHtml(v) {
  return String(v == null ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function uuid() {
  return (crypto.randomUUID && crypto.randomUUID()) ||
    "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
      const r = Math.random() * 16 | 0;
      return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
    });
}

function formatStamp(value) {
  const d = new Date(value);
  if (isNaN(d)) return "";
  const parts = new Intl.DateTimeFormat("en-US", {
    weekday: "short", day: "2-digit", month: "short", year: "2-digit"
  }).formatToParts(d);
  const get = (t) => (parts.find((p) => p.type === t) || {}).value || "";
  return `${get("weekday")}-${get("day")}-${get("month")}-${get("year")}`;
}

function fileSize(bytes) {
  const n = Number(bytes) || 0;
  if (n < 1024) return `${n} B`;
  if (n < 1048576) return `${(n / 1024).toFixed(0)} KB`;
  if (n < 1073741824) return `${(n / 1048576).toFixed(1)} MB`;
  return `${(n / 1073741824).toFixed(2)} GB`;
}

const isImage = (f) => /^image\//.test(f.mime_type || "");

function kindLabel(f) {
  const name = (f.file_name || "").toLowerCase();
  const ext = name.includes(".") ? name.split(".").pop() : "";
  const known = { pdf:"PDF", doc:"DOC", docx:"DOC", xls:"XLS", xlsx:"XLS", csv:"CSV",
    ppt:"PPT", pptx:"PPT", txt:"TXT", zip:"ZIP", msg:"MSG", eml:"EML",
    png:"PNG", jpg:"JPG", jpeg:"JPG", gif:"GIF", webp:"WEBP", mp4:"MP4" };
  return known[ext] || (ext ? ext.slice(0, 4).toUpperCase() : "FILE");
}

function toast(message, options = {}) {
  const el = document.createElement("div");
  el.className = "toast" + (options.tone ? ` toast-${options.tone}` : "");
  const span = document.createElement("span");
  span.textContent = message;
  el.appendChild(span);
  $("toasts").appendChild(el);
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 250); },
    options.duration || 4000);
  return el;
}

function openModal(id) { $(id).hidden = false; document.body.classList.add("modal-open"); }
function closeModal(id) {

  if (!document.querySelector(".modal:not([hidden])")) document.body.classList.remove("modal-open");
  if (id === "editor-modal") editing = null;
  if (id === "confirm-modal") confirmAction = null;

function askConfirm(title, text, onConfirm, label = "Confirm") {

  $("confirm-text").textContent = text;
  $("confirm-ok").textContent = label;
  confirmAction = onConfirm;
  openModal("confirm-modal");
}
document.querySelectorAll("[data-close]").forEach((el) =>
  el.addEventListener("click", () => closeModal(el.dataset.close)));
document.querySelectorAll(".modal").forEach((m) =>
  m.addEventListener("click", (e) => { if (e.target === m) closeModal(m.id); }));
$("confirm-ok").addEventListener("click", () => {
  const a = confirmAction; closeModal("confirm-modal"); if (a) a();
});

/* ==================================================================
   Markdown, matching the other pages
================================================================== */
function inlineMd(t) {
  return t
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}

function renderMarkdown(src) {
  const lines = String(src || "").split("\n");
  let html = "", list = null, para = [];
  const fmt = (t) => inlineMd(escapeHtml(t));
  const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
  const closePara = () => { if (para.length) { html += `<p>${para.map(fmt).join("<br>")}</p>`; para = []; } };
  const closeBlocks = () => { closePara(); closeList(); };

  for (const raw of lines) {
    const line = raw.trimEnd();
    if (!line.trim()) { closeBlocks(); continue; }
    let m;
    if ((m = line.match(/^(#{1,3})\s+(.*)$/))) { closeBlocks(); html += `<h4>${fmt(m[2])}</h4>`; continue; }
    if (/^(---|\*\*\*)\s*$/.test(line)) { closeBlocks(); html += "<hr>"; continue; }
    if ((m = line.match(/^>\s?(.*)$/))) { closeBlocks(); html += `<blockquote>${fmt(m[1])}</blockquote>`; continue; }
    if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) {
      if (list !== "ul") { closeBlocks(); html += "<ul>"; list = "ul"; }
      html += `<li>${fmt(m[1])}</li>`; continue;
    }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
      if (list !== "ol") { closeBlocks(); html += "<ol>"; list = "ol"; }
      html += `<li>${fmt(m[1])}</li>`; continue;
    }
    closeList();
    para.push(line);
  }
  closeBlocks();
  return html;
}

/* ==================================================================
   Duplicate names
================================================================== */
function normaliseTitle(t) {
  return String(t || "").toLowerCase().replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
}
function bigramCounts(text) {
  const map = new Map();
  for (let i = 0; i < text.length - 1; i++) {
    const g = text.slice(i, i + 2);
    map.set(g, (map.get(g) || 0) + 1);
  }
  return map;
}
function charScore(a, b) {
  const ga = bigramCounts(a), gb = bigramCounts(b);
  if (!ga.size || !gb.size) return 0;
  let overlap = 0, total = 0;
  ga.forEach((n, g) => { total += n; if (gb.has(g)) overlap += Math.min(n, gb.get(g)); });
  gb.forEach((n) => { total += n; });
  return total ? (2 * overlap) / total : 0;
}
function wordScore(a, b) {
  const A = new Set(a.split(" ").filter(Boolean));
  const B = new Set(b.split(" ").filter(Boolean));
  if (!A.size || !B.size) return 0;
  let shared = 0;
  A.forEach((w) => { if (B.has(w)) shared++; });
  return (2 * shared) / (A.size + B.size);
}
function similarity(a, b) {
  const A = normaliseTitle(a), B = normaliseTitle(b);
  if (!A || !B) return 0;
  if (A === B) return 1;
  return Math.max(charScore(A, B), wordScore(A, B));
}

function checkDuplicates() {
  const box = $("dupe-warning");
  const name = $("process-name").value;
  const matches = normaliseTitle(name).length < 3 ? [] : processes
    .filter((p) => p.id !== (editing && editing.id))
    .map((p) => ({ p, score: similarity(name, p.name) }))
    .filter((m) => m.score >= DUPE_THRESHOLD)
    .sort((a, b) => b.score - a.score).slice(0, 3);

  if (!matches.length) { box.hidden = true; box.innerHTML = ""; return; }
  const exact = matches[0].score === 1;
  box.hidden = false;
  box.className = "dupe-warning" + (exact ? " is-exact" : "");
  box.innerHTML = `
    <span class="dupe-lead">${exact ? "A process with this exact name already exists" : "This looks like a process you already have"}</span>
    <ul class="dupe-list">
      ${matches.map((m) => `
        <li>
          <button type="button" class="dupe-open" data-open-process="${m.p.id}">${escapeHtml(m.p.name)}</button>
          <span class="dupe-score">${Math.round(m.score * 100)}% alike</span>
        </li>`).join("")}
    </ul>
    <span class="dupe-hint">You can still save this one.</span>`;
}

/* ==================================================================
   Data
================================================================== */
async function loadProcesses() {
  const { data, error } = await sb.from("processes").select("*").order("name");
  if (error) {
    if (error.code === "PGRST205" || /could not find the table|does not exist/i.test(error.message)) {
      const b = $("mode-banner");
      b.hidden = false;
      b.textContent = "The processes tables do not exist yet — run supabase-processes.sql in the Supabase SQL Editor, then reload.";
      processes = [];
      return;
    }
    throw error;
  }

  processes = data;
  const ids = processes.map((p) => p.id);
  if (ids.length) {
    const { data: files } = await sb.from("process_files").select("*").in("process_id", ids);
    const byProcess = {};
    (files || []).forEach((f) => { (byProcess[f.process_id] = byProcess[f.process_id] || []).push(f); });
    processes.forEach((p) => { p.files = byProcess[p.id] || []; });
  }
  processes.forEach((p) => { p.files = p.files || []; });
}

function visible() {
  const term = search.trim().toLowerCase();
  let list = processes.filter((p) => !term ||
    [p.name, p.description, p.owner, (p.files || []).map((f) => f.file_name).join(" ")]
      .join(" ").toLowerCase().includes(term));

  return list.sort((a, b) => {
    if (sortBy === "recent") return Date.parse(b.updated_at) - Date.parse(a.updated_at);
    if (sortBy === "files") return (b.files || []).length - (a.files || []).length;
    return a.name.localeCompare(b.name);
  });
}

/* ==================================================================
   Rendering
================================================================== */
function highlight(text, term) {
  const safe = escapeHtml(text);
  if (!term) return safe;
  const esc = escapeHtml(term).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return safe.replace(new RegExp(`(${esc})`, "gi"), "<mark>$1</mark>");
}

function buildCard(p, term) {
  const card = document.createElement("article");
  card.className = "process";
  card.dataset.id = p.id;
  const open = expanded.has(p.id);
  const files = p.files || [];

  card.innerHTML = `
    <div class="process-head">
      <h2 class="process-name">${highlight(p.name, term)}</h2>
      <div class="process-tools">
        <button type="button" class="btn-ghost small" data-act="edit">Edit</button>
      </div>
    </div>

    <div class="process-meta">
      ${p.owner ? `<span class="chip">${escapeHtml(p.owner)}</span>` : ""}
      <span>Updated ${escapeHtml(formatStamp(p.updated_at))}</span>
      ${files.length ? `<span class="guide-badge">📎 ${files.length}</span>` : ""}
    </div>

    ${p.description && p.description.trim() ? `
      <div class="process-body${open ? " open" : ""}" data-body="${p.id}">
        <div class="process-body-inner">${renderMarkdown(p.description)}</div>
      </div>
      <button type="button" class="read-more" data-act="more" hidden>${open ? "Show less" : "Read more"}</button>
    ` : `<p class="muted-note">No description yet.</p>`}

    ${files.length ? `
      <div class="process-files">
        ${files.map((f) => `
          <button type="button" class="process-file" data-file="${f.id}" title="${escapeHtml(f.file_name)}">
            <span class="file-badge">${isImage(f) ? `<img alt="" loading="lazy" data-thumb="${f.id}">` : escapeHtml(kindLabel(f))}</span>
            <span class="process-file-name">${escapeHtml(f.file_name)}</span>
            <span class="process-file-size">${escapeHtml(fileSize(f.file_size))}</span>
          </button>`).join("")}
      </div>` : ""}`;
  return card;
}

async function loadThumbs() {
  for (const p of visible()) {
    for (const f of (p.files || []).filter(isImage)) {
      const img = document.querySelector(`[data-thumb="${f.id}"]`);
      if (!img || img.dataset.loaded) continue;
      img.dataset.loaded = "1";
      try {
        if (!thumbCache.has(f.id)) thumbCache.set(f.id, await signedUrl(f, false));
        img.src = thumbCache.get(f.id);
      } catch (e) { /* a missing thumbnail should not break the card */ }
    }
  }
}

function updateClamps() {
  document.querySelectorAll(".process-body").forEach((body) => {
    const btn = body.parentElement.querySelector(".read-more");
    if (!btn) return;
    const open = body.classList.contains("open");
    const over = body.scrollHeight > body.clientHeight + 2;
    btn.hidden = !(over || open);
    body.classList.toggle("is-clamped", over && !open);
  });
}

function scheduleClamp() {
  requestAnimationFrame(updateClamps);
  setTimeout(updateClamps, 120);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(updateClamps);
}
window.addEventListener("resize", () => {
  clearTimeout(window.__clampT);
  window.__clampT = setTimeout(updateClamps, 150);
});

function render() {
  const list = $("process-list");
  const items = visible();
  const term = search.trim();
  list.innerHTML = "";

  $("result-line").hidden = !term;
  $("result-line").textContent = term
    ? `${items.length} process${items.length === 1 ? "" : "es"} matching "${term}"` : "";

  if (!items.length) {
    const empty = document.createElement("div");
    empty.className = "guide-empty";
    empty.innerHTML = processes.length
      ? "Nothing matches that."
      : "<strong>No processes yet.</strong><br>Press <em>Add a process</em> to describe your first one.";
    list.appendChild(empty);
  } else {
    items.forEach((p) => list.appendChild(buildCard(p, term)));
  }

  const files = processes.reduce((n, p) => n + (p.files || []).length, 0);
  $("summary").innerHTML = processes.length
    ? `<span class="pill">${processes.length} process${processes.length === 1 ? "" : "es"}</span>
       ${files ? `<span class="pill pill-muted">${files} document${files === 1 ? "" : "s"}</span>` : ""}`
    : "";
  $("status-line").textContent = "";
  $("build-stamp").textContent = `build ${BUILD}`;
  loadThumbs();
  scheduleClamp();
}

/* ==================================================================
   Card actions
================================================================== */
$("process-list").addEventListener("click", async (e) => {
  const card = e.target.closest(".process");
  if (!card) return;
  const p = processes.find((x) => x.id === card.dataset.id);
  if (!p) return;

  const fileBtn = e.target.closest("[data-file]");
  if (fileBtn) {
    const f = (p.files || []).find((x) => x.id === fileBtn.dataset.file);
    if (!f) return;
    if (isImage(f)) return showImage(f);
    const tab = window.open("", "_blank");
    try { const url = await signedUrl(f, false); if (tab) tab.location.href = url; }
    catch (err) { if (tab) tab.close(); toast("Could not open that file.", { tone: "error" }); }
    return;
  }

  const act = e.target.closest("[data-act]");
  if (!act) return;

  if (act.dataset.act === "more") {
    const body = card.querySelector(".process-body");
    const btn = card.querySelector(".read-more");
    const nowOpen = !body.classList.contains("open");
    if (nowOpen) expanded.add(p.id); else expanded.delete(p.id);
    body.classList.toggle("open", nowOpen);
    btn.textContent = nowOpen ? "Show less" : "Read more";
    updateClamps();
    return;
  }

  if (act.dataset.act === "edit") openEditor(p);
});

async function showImage(f) {
  try {
    const url = thumbCache.get(f.id) || await signedUrl(f, false);
    $("lightbox-img").src = url;
    $("lightbox-name").textContent = f.file_name;
    openModal("image-modal");
  } catch (e) { toast("Could not open that image.", { tone: "error" }); }
}

================================================================== */
function openEditor(p) {
  editing = p ? { id: p.id } : { id: null };
  $("editor-title").textContent = p ? "Edit process" : "Add a process";
  $("process-name").value = p ? p.name : "";
  $("process-owner").value = p ? (p.owner || "") : "";
  $("process-body").value = p ? (p.description || "") : "";
  $("delete-process").hidden = !p;
  $("attach-hint").textContent = p ? "" : "Save first, or attach now and it saves automatically";
  checkDuplicates();
  showPreview(false);
  renderEditorFiles();
  openModal("editor-modal");
  setTimeout(() => $("process-name").focus(), 50);
}

$("new-process").addEventListener("click", () => openEditor(null));

let dupeTimer = null;
$("process-name").addEventListener("input", () => {
  clearTimeout(dupeTimer);
  dupeTimer = setTimeout(checkDuplicates, 250);
});

$("dupe-warning").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-open-process]");
  if (!btn) return;
  const target = processes.find((p) => p.id === btn.dataset.openProcess);
  if (!target) return;
  const draft = $("process-body").value.trim();
  if (!(editing && editing.id) && draft) {
    askConfirm("Open the other process?",
      "What you have typed here has not been saved and will be lost.",
      () => openEditor(target), "Discard and open");
    return;
  }
  openEditor(target);
});

const currentProcess = () => editing && editing.id ? processes.find((p) => p.id === editing.id) : null;

function showPreview(on) {
  $("process-preview").hidden = !on;
  $("process-body").hidden = on;
  $("toggle-preview").textContent = on ? "Write" : "Preview";
  if (on) $("process-preview").innerHTML = renderMarkdown($("process-body").value) ||
    '<p class="muted-note">Nothing to preview yet.</p>';
}
$("toggle-preview").addEventListener("click", () => showPreview($("process-preview").hidden));

$("md-bar").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-md]");
  if (!btn) return;
  const ta = $("process-body");
  const start = ta.selectionStart, end = ta.selectionEnd;
  const sel = ta.value.slice(start, end);
  const wrap = (mark) => mark + (sel || "text") + mark;
  const perLine = (prefix) => (sel || "step").split("\n")
    .map((l, i) => (prefix === "1. " ? `${i + 1}. ` : prefix) + l).join("\n");

  let out, caretInside = false;
  switch (btn.dataset.md) {
    case "h":      out = "## " + (sel || "Heading"); break;
    case "bold":   out = wrap("**"); break;
    case "italic": out = wrap("*"); break;
    case "code":   out = wrap("`"); break;
    case "bullet": out = perLine("- "); break;
    case "number": out = perLine("1. "); break;
    case "quote":  out = "> " + (sel || "Remember this"); break;
    case "link":   out = `[${sel || "text"}](https://)`; caretInside = true; break;
  }
  ta.value = ta.value.slice(0, start) + out + ta.value.slice(end);
  const pos = caretInside ? start + out.length - 1 : start + out.length;
  ta.setSelectionRange(pos, pos);
  ta.focus();
});

async function ensureSaved() {
  const name = $("process-name").value.trim();
  if (!name) {
    $("process-name").classList.add("invalid");
    $("process-name").placeholder = "Give this process a name first";
    $("process-name").focus();
    throw new Error("A name is needed first.");
  }
  $("process-name").classList.remove("invalid");

  const patch = { name, owner: $("process-owner").value.trim(), description: $("process-body").value };

  if (editing.id) {
    const { error } = await sb.from("processes").update(patch).eq("id", editing.id);
    if (error) throw error;
    const p = currentProcess();
    Object.assign(p, patch, { updated_at: new Date().toISOString() });
    return editing.id;
  }

  const row = { id: uuid(), user_id: currentUser.id, ...patch };
  const { data, error } = await sb.from("processes").insert(row).select().single();
  if (error) throw error;
  data.files = [];
  processes.push(data);
  editing.id = data.id;
  $("editor-title").textContent = "Edit process";
  $("delete-process").hidden = false;
  $("attach-hint").textContent = "";
  return data.id;
}

$("save-process").addEventListener("click", async () => {
  try {
    await ensureSaved();
    closeModal("editor-modal");
    render();
    toast("Process saved.", { tone: "success" });
  } catch (error) {
    if (error.message !== "A name is needed first.") {
      toast(error.message || "Could not save.", { tone: "error", duration: 9000 });
    }
  }
});

$("delete-process").addEventListener("click", () => {
  const p = currentProcess();
  if (!p) return;
  askConfirm("Delete process",
    `"${p.name}" and its ${(p.files || []).length} document(s) will be permanently deleted.`,
    async () => {
      try {
        const paths = (p.files || []).map((f) => f.file_path);
        if (paths.length) await sb.storage.from(BUCKET).remove(paths);
        const { error } = await sb.from("processes").delete().eq("id", p.id);
        if (error) throw error;
        processes = processes.filter((x) => x.id !== p.id);
        closeModal("editor-modal");
        render();
        toast("Process deleted.");
      } catch (e) { toast("Could not delete that process.", { tone: "error" }); }
    }, "Delete");
});

/* ==================================================================
   Files
================================================================== */
async function signedUrl(f, forDownload) {
  const { data, error } = await sb.storage.from(BUCKET)
    .createSignedUrl(f.file_path, 3600, forDownload ? { download: f.file_name } : undefined);
  if (error) throw error;
  return data.signedUrl;
}

async function uploadOne(processId, file, onProgress) {
  const path = `${currentUser.id}/processes/${processId}/${uuid()}-${file.name}`;

  if (file.size >= RESUMABLE_THRESHOLD && window.tus) {
    const { data } = await sb.auth.getSession();
    const token = data.session.access_token;
    await new Promise((resolve, reject) => {
      const up = new window.tus.Upload(file, {
        endpoint: `${SUPABASE_URL}/storage/v1/upload/resumable`,
        headers: { authorization: `Bearer ${token}`, "x-upsert": "false" },
        uploadDataDuringCreation: true, chunkSize: RESUMABLE_THRESHOLD,
        metadata: { bucketName: BUCKET, objectName: path, contentType: file.type || "application/octet-stream" },
        onError: reject, onSuccess: resolve,
        onProgress: (s, t) => onProgress && onProgress(s / t)
      });
      up.start();
    });
  } else {
    const { error } = await sb.storage.from(BUCKET)
      .upload(path, file, { contentType: file.type || "application/octet-stream" });
    if (error) throw error;
  }

  const row = { process_id: processId, user_id: currentUser.id, file_name: file.name,
                file_path: path, file_size: file.size, mime_type: file.type || null };
  const { data, error } = await sb.from("process_files").insert(row).select().single();
  if (error) { await sb.storage.from(BUCKET).remove([path]); throw error; }
  return data;
}

async function attachFiles(fileList) {
  let processId;
  try { processId = await ensureSaved(); }
  catch (e) {
    if (e.message === "A name is needed first.") toast("Name the process, then attach.", { tone: "warn" });
    return;
  }

  const p = currentProcess();
  for (const file of Array.from(fileList)) {
    if (file.size > MAX_UPLOAD_MB * 1024 * 1024) {
      toast(`"${file.name}" is ${fileSize(file.size)} — over the ${MAX_UPLOAD_MB} MB limit.`,
        { tone: "error", duration: 10000 });
      continue;
    }
    if ((p.files || []).some((f) => f.file_name.toLowerCase() === file.name.toLowerCase())) {
      toast(`"${file.name}" is already attached to this process.`, { tone: "warn", duration: 8000 });
      continue;
    }
    const pending = toast(`Uploading ${file.name}…`, { duration: 120000 });
    try {
      const att = await uploadOne(processId, file);
      p.files.push(att);
      pending.remove();
      renderEditorFiles();
      toast(`${file.name} attached.`, { tone: "success" });
    } catch (error) {
      pending.remove();
      console.error("Upload failed", file.name, error);
      toast(`${file.name} failed. ${error.message || ""}`.trim(), { tone: "error", duration: 10000 });
    }
  }
}

function renderEditorFiles() {
  const list = $("file-list");
  list.innerHTML = "";
  const p = currentProcess();
  const files = p ? (p.files || []) : [];
  if (!files.length) {
    const li = document.createElement("li");
    li.className = "file-empty";
    li.textContent = "Nothing attached yet.";
    list.appendChild(li);
    return;
  }
  files.forEach((f) => {
    const li = document.createElement("li");
    li.className = "file-row";
    li.innerHTML = `
      <button type="button" class="file-name" data-open="${f.id}">${escapeHtml(f.file_name)}</button>
      <span class="file-meta">${escapeHtml(fileSize(f.file_size))}</span>
      <button type="button" class="btn-ghost small" data-save="${f.id}">Save</button>
      <button type="button" class="icon-btn" data-remove="${f.id}" aria-label="Remove">✕</button>`;
    list.appendChild(li);
  });
}

$("file-list").addEventListener("click", async (e) => {
  const p = currentProcess();
  if (!p) return;
  const find = (id) => (p.files || []).find((f) => f.id === id);

  const openId = e.target.dataset.open;
  if (openId) {
    const f = find(openId);
    if (isImage(f)) return showImage(f);
    const tab = window.open("", "_blank");
    try { const url = await signedUrl(f, false); if (tab) tab.location.href = url; }
    catch (err) { if (tab) tab.close(); toast("Could not open that file.", { tone: "error" }); }
    return;
  }

  const saveId = e.target.dataset.save;
  if (saveId) {
    try {
      const f = find(saveId);
      const url = await signedUrl(f, true);
      const a = document.createElement("a");
      a.href = url; a.download = f.file_name;
      document.body.appendChild(a); a.click(); a.remove();
    } catch (err) { toast("Could not save that file.", { tone: "error" }); }
    return;
  }

  const removeId = e.target.dataset.remove;
  if (removeId) {
    const f = find(removeId);
    askConfirm("Remove document", `"${f.file_name}" will be permanently deleted.`, async () => {
      try {
        await sb.storage.from(BUCKET).remove([f.file_path]);
        await sb.from("process_files").delete().eq("id", f.id);
        p.files = p.files.filter((x) => x.id !== f.id);
        renderEditorFiles();
        render();
        toast("Document removed.");
      } catch (err) { toast("Could not remove that document.", { tone: "error" }); }
    }, "Delete");
  }
});

$("pick-file").addEventListener("click", () => $("file-input").click());
$("file-input").addEventListener("change", (e) => {
  const files = Array.from(e.target.files || []);   // copy before clearing
  e.target.value = "";
  if (files.length) attachFiles(files);
});

const dz = $("dropzone");
["dragenter", "dragover"].forEach((ev) =>
  dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add("over"); }));
["dragleave", "drop"].forEach((ev) =>
  dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.remove("over"); }));
dz.addEventListener("drop", (e) => {
  if (e.dataTransfer && e.dataTransfer.files.length) attachFiles(e.dataTransfer.files);
});

$("editor-modal").addEventListener("paste", (e) => {
  const items = Array.from((e.clipboardData && e.clipboardData.items) || []);
  const images = items.filter((i) => i.type.startsWith("image/"));
  if (!images.length) return;
  e.preventDefault();
  const stamp = `screenshot-${new Date().toISOString().replace(/[:.]/g, "-")}.png`;
  attachFiles(images.map((i) => {
    const blob = i.getAsFile();
    return new File([blob], blob.name && blob.name !== "image.png" ? blob.name : stamp, { type: blob.type });
  }));
});

/* ==================================================================
   Toolbar
================================================================== */
let searchTimer = null;
$("search-input").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  const v = e.target.value;
  searchTimer = setTimeout(() => { search = v; render(); }, 150);
});
$("sort-by").addEventListener("change", (e) => { sortBy = e.target.value; render(); });

document.addEventListener("keydown", (e) => {
  const dialog = document.querySelector(".modal:not([hidden])");
  if (e.key === "Escape" && dialog) return closeModal(dialog.id);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault(); $("search-input").focus(); $("search-input").select();
  }
  if (dialog && dialog.id === "editor-modal" && (e.metaKey || e.ctrlKey) && e.key === "Enter") {
    e.preventDefault(); $("save-process").click();
  }
});

/* ==================================================================
   Auth
================================================================== */
let authMode = "signin";
function setAuthMode(next) {
  authMode = next;
  const inMode = authMode === "signin";
  $("auth-sub").textContent = inMode ? "Sign in to your processes" : "Create your account";
  $("auth-submit").textContent = inMode ? "Sign in" : "Create account";
  $("auth-toggle").textContent = inMode ? "Create one" : "I already have an account";
  $("auth-reset").hidden = !inMode;
  $("auth-error").hidden = true;
}
function authError(msg) { const el = $("auth-error"); el.textContent = msg; el.hidden = !msg; }
$("auth-toggle").addEventListener("click", () => setAuthMode(authMode === "signin" ? "signup" : "signin"));

$("auth-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  authError("");
  const email = $("auth-email").value.trim(), password = $("auth-password").value;
  try {
    if (authMode === "signin") {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    } else {
      const { data, error } = await sb.auth.signUp({ email, password });
      if (error) throw error;
      if (!data.session) { authError("Check your email for a confirmation link."); setAuthMode("signin"); }
    }
  } catch (error) { authError(error.message || "That did not work."); }
});

$("auth-reset").addEventListener("click", async () => {
  const email = $("auth-email").value.trim();
  if (!email) return authError("Enter your email first.");
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href });
  authError(error ? error.message : "Password reset link sent.");
});

$("sign-out").addEventListener("click", () => sb.auth.signOut());

/* ==================================================================
   Start
================================================================== */
async function boot(user) {
  currentUser = user;
  $("account-email").textContent = user.email;
  $("account").hidden = false;
  $("gate").hidden = true;
  $("app").hidden = false;
  $("app-header").hidden = false;
  try { await loadProcesses(); } catch (e) { toast(e.message || "Could not load processes.", { tone: "error" }); }
  render();
}

async function init() {
  document.documentElement.style.setProperty("--clamp-lines", CLAMP_LINES);
  setAuthMode("signin");
  if (!window.supabase) {
    document.body.innerHTML = "<p style='padding:40px;font-family:sans-serif;color:#ccc'>Could not load the Supabase library. Check your connection and reload.</p>";
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  sb.auth.onAuthStateChange((event, session) => {
    if (session && session.user) { if (!currentUser) boot(session.user); }
    else {
      currentUser = null; processes = [];
      $("account").hidden = true;
      $("gate").hidden = false; $("app").hidden = true; $("app-header").hidden = true;
    }
  });

  const { data } = await sb.auth.getSession();
  if (data.session && data.session.user) await boot(data.session.user);
  else $("gate").hidden = false;
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();
</script>
